name: Setup
description: Install pnpm, Node.js and project dependencies.

inputs:
  node-version:
    description: Node.js version to set up.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      # No --ignore-scripts on purpose: `allowBuilds` in pnpm-workspace.yaml already names the
      # only four packages allowed to run a lifecycle script, which is narrower than the flag.
      # esbuild is one of them, and without its postinstall vite/vitest have no usable binary.
      run: pnpm install --frozen-lockfile
