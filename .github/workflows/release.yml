name: Release

on:
  push:
    branches: [main]

# Only one release may be in flight at a time; never cancel a partial publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Maintains a standing release PR. Merging that PR tags the release and
  # flips release_created, which gates the publish job below.
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC token for npm trusted publishing. With it, no NPM_TOKEN
      # is needed and provenance attestations are generated automatically.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}

      - uses: ./.github/actions/setup

      - name: Ensure npm supports trusted publishing
        # Trusted publishing needs npm >= 11.5.1. Too old an npm falls back to
        # token auth and fails confusingly rather than loudly.
        run: npm install -g npm@latest

      - name: Build
        run: pnpm build

      - name: Publish
        run: npm publish
