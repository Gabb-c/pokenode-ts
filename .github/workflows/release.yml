name: Release

on:
  push:
    branches: [main]
  # republishes an existing release whose publish failed; a re-run would reuse the broken workflow
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v3.1.0
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  publish:
    name: Publish to npm
    needs: release-please
    # !cancelled() lets a dispatch run past the skipped release-please job
    if: ${{ !cancelled() && (inputs.tag != '' || needs.release-please.outputs.release-created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag-name }}

      - uses: ./.github/actions/setup

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@12.0.2 --ignore-scripts

      - name: Build
        run: pnpm build

      # the tarball attached to the release is the one npm receives
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"

      - name: Publish
        run: npm publish "$RUNNER_TEMP"/pkg/pokenode-ts-*.tgz

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg/pokenode-ts-*.tgz
          if-no-files-found: error

  release-assets:
    name: Finalize GitHub release
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    # separate from publish so the job running npm lifecycle scripts never holds a repo write token
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag-name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag-name }}

      - uses: actions/download-artifact@v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg

      - name: Attach tarball
        run: gh release upload "$TAG" "$RUNNER_TEMP"/pkg/pokenode-ts-*.tgz --clobber

      - name: Style release notes
        run: bash .github/scripts/release-notes.sh "$TAG"
