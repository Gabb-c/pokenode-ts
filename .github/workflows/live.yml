name: Live

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: PokéAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      - name: Check the PokéAPI is up
        id: upstream
        run: |
          # An outage is not drift. Without this gate a bad morning upstream
          # files an issue telling the maintainer their models are stale.
          #
          # curl prints 000 itself when it never got a response, so a `|| echo`
          # fallback would write a second line and break $GITHUB_OUTPUT parsing.
          # The trailing `|| true` only swallows curl's exit status, which `set
          # -e` would otherwise turn a transient outage into a failed step with.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            https://pokeapi.co/api/v2/berry/1) || true

          echo "code=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" != "200" ]; then
            echo "::warning::The PokéAPI answered $code; skipping the drift check."
          fi

      - name: Run tests (live)
        id: live
        if: steps.upstream.outputs.code == '200'
        # Drift is reported as an issue, not as a red run, so that a failing
        # schedule always means the workflow itself broke.
        continue-on-error: true
        run: pnpm test:live

      # Gated on the test step rather than the job, so a checkout or install
      # failure cannot be reported as an upstream schema change. `always()` is
      # load-bearing: an `if` with no status function is implicitly ANDed with
      # `success()`, which would skip this step on the very runs it exists for.
      - name: Report drift
        if: always() && steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Re-ping an open issue at most once a month: the check runs weekly, so
          # drift left open would otherwise collect an identical comment every Monday.
          THROTTLE_SECONDS=$((28 * 24 * 60 * 60))
          # Past that, a closed issue is history rather than this week's drift.
          REOPEN_SECONDS=$((90 * 24 * 60 * 60))

          body="The scheduled PokéAPI contract check failed: $RUN_URL

          The upstream response shape most likely changed, which means \`src/models\` is out of
          date. This is not a regression in the client."

          # Every path below records what it did. A run whose comment was throttled
          # away still says so on the run page instead of looking clean.
          summary() {
            printf '### PokéAPI drift detected\n\n%s\n\nRun: %s\n' "$1" "$RUN_URL" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          # Seconds since the epoch, or a hard failure. Falling through on an
          # unparseable timestamp would silence the report on the runs it exists for.
          epoch() {
            local seconds
            seconds=$(date -u -d "$1" +%s 2>/dev/null) || true

            if [ -z "$seconds" ]; then
              # stderr: the caller reads this function's stdout for the value.
              echo "::error::Could not parse the timestamp \"$1\"." >&2
              return 1
            fi

            printf '%s' "$seconds"
          }

          # --force so a missing label is created and an existing one is left usable.
          gh label create live-drift --color D93F0B --description "Upstream PokéAPI shape changed" --force

          # Closed issues are searched too: drift that returns after a fix belongs on
          # the issue already describing it, not on a fresh duplicate.
          existing=$(gh issue list --label live-drift --state all --limit 1 \
            --json number,state,updatedAt \
            --jq '.[0] | select(.) | "\(.number) \(.state) \(.updatedAt)"')

          file_issue() {
            url=$(gh issue create \
              --title "PokéAPI contract check failed" \
              --label live-drift \
              --body "$body")
            summary "Filed $url"
          }

          if [ -z "$existing" ]; then
            file_issue
            exit 0
          fi

          read -r number state updated <<< "$existing"
          now=$(date -u +%s)

          if [ "$state" = "CLOSED" ]; then
            updated_epoch=$(epoch "$updated") || exit 1

            if [ $((now - updated_epoch)) -gt "$REOPEN_SECONDS" ]; then
              file_issue
              exit 0
            fi

            gh issue reopen "$number" --comment "$body"
            summary "Reopened #$number."
            exit 0
          fi

          # Only this workflow's own comments count. Keying off the last comment
          # by anyone would let a maintainer reply reset the clock and silence
          # the next four weeks of genuinely new drift.
          last=$(gh issue view "$number" --json comments,createdAt \
            --jq '([.comments[] | select(.author.login == "github-actions") | .createdAt] | last) // .createdAt')
          last_epoch=$(epoch "$last") || exit 1

          if [ $((now - last_epoch)) -lt "$THROTTLE_SECONDS" ]; then
            summary "#$number was already reported at $last; comment suppressed."
            exit 0
          fi

          gh issue comment "$number" --body "$body"
          summary "Commented on #$number."
